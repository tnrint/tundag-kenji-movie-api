<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Movie Collection</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #14151a;
    color: #f0f0f2;
    max-width: 720px;
    margin: 40px auto;
    padding: 0 20px;
  }
  h1 { margin-bottom: 4px; }
  p.subtitle { color: #9a9aa5; margin-top: 0; margin-bottom: 28px; }

  form {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr auto;
    gap: 10px;
    margin-bottom: 28px;
  }
  input {
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #3a3b45;
    background: #1e1f27;
    color: #f0f0f2;
    font-size: 14px;
  }
  button {
    padding: 10px 16px;
    border-radius: 6px;
    border: none;
    background: #5b6bff;
    color: white;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #4756e6; }

  #error {
    color: #ff6b6b;
    margin: -10px 0 20px 0;
    font-size: 14px;
    min-height: 18px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }
  th, td {
    text-align: left;
    padding: 10px 8px;
    border-bottom: 1px solid #2b2c35;
    font-size: 14px;
  }
  th { color: #9a9aa5; font-weight: 600; }
  #empty { color: #9a9aa5; font-style: italic; padding: 12px 0; }

  @media (max-width: 600px) {
    form { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

  <h1>🎬 Movie Collection</h1>
  <p class="subtitle">Simple REST API demo — Express backend, in-memory storage.</p>

  <form id="movie-form">
    <input type="text" id="title" placeholder="Title" required />
    <input type="text" id="genre" placeholder="Genre" required />
    <input type="number" id="year" placeholder="Year" required />
    <button type="submit">Add Movie</button>
  </form>

  <div id="error"></div>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Genre</th>
        <th>Year</th>
      </tr>
    </thead>
    <tbody id="movie-list"></tbody>
  </table>
  <div id="empty" style="display:none;">No movies yet. Add one above.</div>

<script>
  const form = document.getElementById('movie-form');
  const listEl = document.getElementById('movie-list');
  const emptyEl = document.getElementById('empty');
  const errorEl = document.getElementById('error');

  async function loadMovies() {
    errorEl.textContent = '';
    try {
      const res = await fetch('/api/movies');
      if (!res.ok) throw new Error('Failed to load movies.');
      const movies = await res.json();
      renderMovies(movies);
    } catch (err) {
      errorEl.textContent = err.message;
    }
  }

  function renderMovies(movies) {
    listEl.innerHTML = '';
    if (!movies.length) {
      emptyEl.style.display = 'block';
      return;
    }
    emptyEl.style.display = 'none';

    for (const movie of movies) {
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${movie.id}</td>
        <td>${escapeHtml(movie.title)}</td>
        <td>${escapeHtml(movie.genre)}</td>
        <td>${movie.year}</td>
      `;
      listEl.appendChild(row);
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.textContent = '';

    const title = document.getElementById('title').value.trim();
    const genre = document.getElementById('genre').value.trim();
    const year = document.getElementById('year').value.trim();

    try {
      const res = await fetch('/api/movies', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, genre, year })
      });

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || 'Failed to add movie.');
      }

      form.reset();
      await loadMovies(); // refresh the list after adding a movie
    } catch (err) {
      errorEl.textContent = err.message;
    }
  });

  loadMovies();
</script>
</body>
</html>
